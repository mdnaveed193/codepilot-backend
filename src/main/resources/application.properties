
spring.application.name=codepilot
#spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/codepilot}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/codepilot}

spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD}
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

spring.security.oauth2.client.registration.github.scope=read:user,user:email,repo

spring.security.oauth2.client.registration.github.client-name=GitHub

spring.security.oauth2.client.registration.github.authorization-grant-type=authorization_code

spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
#spring.security.oauth2.client.registration.github.scope=repo,user:email,read:user
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:259200000}

codepilot.oauth-success-url=${CODEPILOT_OAUTH_SUCCESS_URL:http://localhost:8080/oauth-success.html}


oauth.code.expiration=${OAUTH_CODE_EXPIRATION:120000}

github.token.encryption-key=${GITHUB_TOKEN_ENCRYPTION_KEY}
